    // vanilla.js/lodash/handlerbars.js
    function $tpl(tpl, locals, filters) {
      filters = filters || {};
      
      return tpl.replace(/{{\s*(\w+)(?:\s*\|\s*(\w+))?\s*}}/g,
        function(match, key, filterName) {
          var value = locals[key] !== undefined ? locals[key] : "";
          if (filterName && filters[filterName]) {
            value = filters[filterName](value);
          }
          return value;
        });
    }

    // vanilla.js/jquery/html.js
    function $html(selector, html) {
      // The selector should return ONE and only ONE element
      var el = document.querySelector(selector);
      el.innerHTML = html;
      return el;
    };

    var TPL = '<li class="{{ klass }}">{{ feature }}</li>';

    var useragent = [];
    useragent.push($tpl(TPL, { feature: navigator.userAgent, klass: '' }));
    useragent.push($tpl(TPL, { feature: 'device: ' + head.agent.device.type, klass: '' }));
    useragent.push($tpl(TPL, { feature: 'os: ' + head.agent.os.name + '@' + head.agent.os.major, klass: '' }));
    useragent.push($tpl(TPL, { feature: 'browser: ' + head.agent.browser.name + '@' + head.agent.browser.major, klass: '' }));
    $html('.js-useragent', useragent.join(''));

    function $render(M, features, container) {
      var html = [];
      for (var f of features) {
        html.push($tpl(TPL, { feature: f, klass: M[f] ? '': 'feature-failed' }));
      }
      $html(container, html.join(''));
    }

    var BASELINE = [
      'es6/promieses',
      'es6/arrow',
      'es6/rest-parameters',
      'es6/spread-array',
      'es6/weak-map',
      'css/vars',
      'web-worker',
    ];

    var OPTIMISTIC = [
      'es7/spread-object',
      'img/webp/lossless',
      'img/webp/alpha',
      'img/webp/animation',
      'extra/http2',
      'service-worker',
    ];

    head.modernizr(function (M) {
      $render(M, BASELINE, '.js-baseline');
      $render(M, OPTIMISTIC, '.js-optimistic');
    });
  </script>
